[project]
name = 'contracts'
description = ''
authors = []
telemetry = true
cache_dir = './.cache'
requirements = []
[contracts.sip-010-trait]
path = 'contracts/sip-010-trait.clar'
clarity_version = 3
epoch = 3.1

[contracts.guard-token]
path = 'contracts/guard-token.clar'
clarity_version = 3
epoch = 3.1
depends_on = ['sip-010-trait']

[contracts.reward-settlement]
path = 'contracts/reward-settlement.clar'
clarity_version = 3
epoch = 3.1
depends_on = ['guard-token']

# The optional `check_checker` static-analysis pass flags any function
# argument that reaches a "sensitive" built-in (ft-mint?, ft-transfer?,
# var-set, ...) without being compared/filtered first. For guard-token and
# reward-settlement, the flagged arguments (amount, recipient, new-cap,
# new-minter) are the intentional, legitimate payload of an
# already-authorization-gated public function (every mutating function
# starts with an `asserts!` on tx-sender / contract-owner / authorized
# minter) -- there is no additional "check" to perform on a mint amount or
# recipient address, that's the point of the function. Left enabled, this
# pass only produces false-positive warnings against the PRD's own
# reference design, so it is disabled here.
[repl.analysis]
passes = []

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
