[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alertguard-ml"
version = "0.1.0"
description = "AlertGuard drowsy-driving detection: Python prototype of feature extraction, state machine, and evaluation harness"
requires-python = ">=3.10"
readme = "README.md"
license = "LicenseRef-Proprietary"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=src/alertguard_ml --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/alertguard_ml"]
